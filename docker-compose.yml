services:

  # ─────────────────────────────────────────
  # Kafka Broker (KRaft mode, no Zookeeper)
  # ─────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-ecommerce
    hostname: kafka
    ports:
      # Exposes Kafka to your host machine (Python scripts running locally)
      - "9092:9092"
    environment:
      # Node and Role Configuration (KRaft Mode)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners configuration:
      # - PLAINTEXT: Listens for client connections and advertises localhost:9092
      # - CONTROLLER: Listens for internal KRaft metadata quorum on port 9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Development single-node replication parameters
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - ecommerce-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # PostgreSQL 16 — Persistent analytics store
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres-ecommerce
    hostname: postgres
    ports:
      # Exposes Postgres to your host machine for local inspection / DBeaver
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER:     ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
    volumes:
      # Named volume — data survives container restarts
      - postgres-data:/var/lib/postgresql/data
      # Auto-runs schema.sql the FIRST time the container starts
      - ./src/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom_user} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net
    restart: unless-stopped

# ─────────────────────────────────────────
# Shared bridge network
# ─────────────────────────────────────────
networks:
  ecommerce-net:
    driver: bridge

# ─────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────
volumes:
  postgres-data:
