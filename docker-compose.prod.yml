# =============================================================
# docker-compose.prod.yml
# Production Multi-Container Orchestration Stack
# =============================================================
# Services:
#   1. kafka: Apache Kafka 3.9.0 (KRaft mode)
#   2. init-kafka: Auto-creates topics with 3 partitions
#   3. postgres: PostgreSQL 16 with schema & persistence
#   4. consumer-1, consumer-2, consumer-3: 3 parallel worker instances
#   5. producer: Synthetic chaos traffic generator
# =============================================================

services:

  # ─────────────────────────────────────────
  # 1. Kafka Broker (KRaft Mode)
  # ─────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-prod
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - ecommerce-prod-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 2. Topic Initializer (Creates 3 partitions)
  # ─────────────────────────────────────────
  init-kafka:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    entrypoint: [ "bash", "-c" ]
    command: |
      "
      # Wait for Kafka broker readiness
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      
      echo 'Creating topic ecommerce-events with 3 partitions...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ecommerce-events --partitions 3 --replication-factor 1
      
      echo 'Creating topic ecommerce-dead-letter...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic ecommerce-dead-letter --partitions 1 --replication-factor 1
      
      echo 'Topics successfully initialized.'
      "
    networks:
      - ecommerce-prod-net

  # ─────────────────────────────────────────
  # 3. PostgreSQL 16 Analytics Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./src/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom_user} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-prod-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 4. Consumer Worker 1
  # ─────────────────────────────────────────
  consumer-1:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: consumer-worker-1
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
    depends_on:
      postgres:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - ecommerce-prod-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 5. Consumer Worker 2 (Parallel Scale)
  # ─────────────────────────────────────────
  consumer-2:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: consumer-worker-2
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
    depends_on:
      postgres:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - ecommerce-prod-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 6. Consumer Worker 3 (Parallel Scale)
  # ─────────────────────────────────────────
  consumer-3:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: consumer-worker-3
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
    depends_on:
      postgres:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - ecommerce-prod-net
    restart: unless-stopped

  # ─────────────────────────────────────────
  # 7. Synthetic Event Producer (Traffic Ingestion)
  # ─────────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: producer-traffic-gen
    environment:
      SCENARIO: ${SCENARIO:-CHAOS}
      RATE: ${RATE:-35.0}
      MAX_EVENTS: ${MAX_EVENTS:-0}       # 0 = runs continuous streaming
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - ecommerce-prod-net
    restart: unless-stopped

networks:
  ecommerce-prod-net:
    driver: bridge

volumes:
  postgres-prod-data:
